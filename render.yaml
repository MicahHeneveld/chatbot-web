# Render Blueprint — ECG Knowledge Chatbot (Web Service, not a static site:
# the LLM API key lives in the server environment and retrieval runs against
# the vendored SQLite index on the server.)
services:
  - type: web
    name: ecg-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: GITHUB_REPO
        value: ""
      - key: CORS_ORIGINS
        value: "*"
